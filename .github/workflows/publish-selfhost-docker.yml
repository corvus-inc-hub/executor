name: Publish Self-host Docker Image
run-name: "${{ format('publish self-host docker {0}', inputs.tag) }}"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (e.g. v1.5.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-selfhost-docker-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.validate.outputs.tag }}
      image: ${{ steps.image.outputs.image }}
      tags: ${{ steps.image.outputs.tags }}
      labels: ${{ steps.image.outputs.labels }}
      revision: ${{ steps.image.outputs.revision }}
      upstream_revision: ${{ steps.image.outputs.upstream_revision }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Validate release tag
        id: validate
        env:
          RAW_RELEASE_TAG: ${{ inputs.tag }}
        run: bun run scripts/validate-release-ref.ts --tag-env RAW_RELEASE_TAG --write-env RELEASE_TAG --output tag

      - name: Checkout release tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          auth_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --force --tags "$auth_remote" "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git checkout --detach "$RELEASE_TAG"

      - name: Resolve image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/executor-selfhost"
          revision="$(git rev-parse HEAD)"
          upstream_revision="$(tr -d '\r\n' < apps/host-selfhost/upstream-baseline.txt)"

          if [[ ! "$upstream_revision" =~ ^[a-f0-9]{40}$ ]]; then
            echo "apps/host-selfhost/upstream-baseline.txt must contain one exact Git commit SHA."
            exit 1
          fi
          git cat-file -e "${upstream_revision}^{commit}"

          if [[ "$version" == *-* ]]; then
            channel="beta"
          else
            channel="latest"
          fi

          {
            echo "image=$image"
            echo "version=$version"
            echo "channel=$channel"
            echo "revision=$revision"
            echo "upstream_revision=$upstream_revision"
            echo "tags<<TAGS"
            echo "${image}:${RELEASE_TAG}"
            echo "${image}:${version}"
            echo "${image}:${channel}"
            echo "TAGS"
            echo "labels<<LABELS"
            echo "org.opencontainers.image.title=Executor self-host"
            echo "org.opencontainers.image.description=Single-container self-hosted Executor"
            echo "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${revision}"
            echo "org.opencontainers.image.version=${version}"
            echo "LABELS"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push self-host image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/host-selfhost/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.metadata.outputs.labels }}
          build-args: |
            EXECUTOR_IMAGE_SOURCE=https://github.com/${{ github.repository }}
            EXECUTOR_SOURCE_REVISION=${{ needs.metadata.outputs.revision }}
            EXECUTOR_UPSTREAM_REVISION=${{ needs.metadata.outputs.upstream_revision }}
          outputs: type=image,name=${{ needs.metadata.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export image digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if [ -z "$DIGEST" ]; then
            echo "Build did not return a digest."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Release gate: boot the exact by-digest image each build leg pushed using
  # the owned WorkOS identity contract before any user-visible tag moves.
  # The upstream Better Auth scenario suite is intentionally not a compatibility
  # gate for this WorkOS-only fork.
  smoke:
    needs:
      - metadata
      - build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image digest
        uses: actions/download-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests

      - name: Resolve image reference
        id: image_ref
        shell: bash
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
        run: |
          set -euo pipefail
          digest_file="$(find "$RUNNER_TEMP/digests" -maxdepth 1 -type f | head -n 1)"
          if [ -z "$digest_file" ]; then
            echo "No image digest was downloaded."
            exit 1
          fi
          ref="${IMAGE}@sha256:$(basename "$digest_file")"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          docker pull "$ref"

      - name: Boot WorkOS-only image from the published digest
        shell: bash
        env:
          E2E_SELFHOST_DOCKER_IMAGE: ${{ steps.image_ref.outputs.ref }}
          EXPECTED_REVISION: ${{ needs.metadata.outputs.revision }}
          EXPECTED_UPSTREAM_REVISION: ${{ needs.metadata.outputs.upstream_revision }}
        run: |
          set -euo pipefail

          name="executor-release-probe-${{ matrix.arch }}"
          data_volume="${name}-data"
          cleanup() {
            docker logs "$name" > "$RUNNER_TEMP/${name}.log" 2>&1 || true
            docker rm --force "$name" >/dev/null 2>&1 || true
            docker volume rm "$data_volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          actual_revision="$(docker image inspect "$E2E_SELFHOST_DOCKER_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [ "$actual_revision" != "$EXPECTED_REVISION" ]; then
            echo "Image revision mismatch: expected $EXPECTED_REVISION, got $actual_revision"
            exit 1
          fi
          actual_upstream_revision="$(docker image inspect "$E2E_SELFHOST_DOCKER_IMAGE" --format '{{ index .Config.Labels "io.mnfst.executor.upstream-revision" }}')"
          if [ "$actual_upstream_revision" != "$EXPECTED_UPSTREAM_REVISION" ]; then
            echo "Image upstream revision mismatch: expected $EXPECTED_UPSTREAM_REVISION, got $actual_upstream_revision"
            exit 1
          fi

          docker run --detach \
            --name "$name" \
            --network host \
            --volume "$data_volume:/data" \
            -e PORT=42605 \
            -e EXECUTOR_WEB_BASE_URL=http://localhost:42605 \
            -e EXECUTOR_ALLOW_LOCAL_NETWORK=true \
            -e EXECUTOR_AUTH_PROVIDER=workos-authkit \
            -e WORKOS_API_KEY=sk_test_executor_release_probe \
            -e WORKOS_CLIENT_ID=client_executor_release_probe \
            -e WORKOS_COOKIE_PASSWORD=executor-release-probe-cookie-password \
            -e WORKOS_AUTHKIT_DOMAIN=https://example.authkit.app \
            -e WORKOS_SERVICE_ORGANIZATION_ID=org_executor_release_probe \
            -e WORKOS_M2M_ALLOWED_CLIENT_IDS=client_manifest_trigger_probe \
            "$E2E_SELFHOST_DOCKER_IMAGE"

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:42605/api/health > /dev/null; then
              exit 0
            fi
            if [ "$(docker inspect "$name" --format '{{.State.Running}}')" != "true" ]; then
              docker logs "$name"
              exit 1
            fi
            sleep 2
          done

          docker logs "$name"
          echo "Timed out waiting for the Executor health endpoint"
          exit 1

  merge:
    needs:
      - metadata
      - build
      - smoke
    runs-on: ubuntu-24.04
    permissions:
      packages: write

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch self-host image
        shell: bash
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          TAGS: ${{ needs.metadata.outputs.tags }}
        run: |
          set -euo pipefail

          sources=()
          while IFS= read -r digest_file; do
            digest="$(basename "$digest_file")"
            [[ -n "$digest" ]] || continue
            sources+=("${IMAGE}@sha256:${digest}")
          done < <(find "$RUNNER_TEMP/digests" -maxdepth 1 -type f | sort)

          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No image digests were downloaded."
            exit 1
          fi

          tag_args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            tag_args+=("-t" "$tag")
          done <<< "$TAGS"

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
