# WorkOS-authenticated self-hosted Executor.
#
#   docker compose up -d --build      # build the image and start
#   open http://localhost:4788        # continue to WorkOS AuthKit
#
# SQLite, QuickJS code execution, integrations, and MCP run in this container.
# WorkOS AuthKit supplies identity. Create .env from .env.example before boot.
# The named volume persists the database and Executor encryption key.

services:
  executor:
    build:
      # Build context is the repo root: the Bun workspace install needs every member.
      context: ../..
      dockerfile: apps/host-selfhost/Dockerfile
      args:
        EXECUTOR_IMAGE_SOURCE: ${EXECUTOR_IMAGE_SOURCE:-local}
        EXECUTOR_SOURCE_REVISION: ${EXECUTOR_SOURCE_REVISION:-development}
    image: executor-selfhost
    restart: unless-stopped
    ports:
      - "4788:4788"
    env_file:
      - path: .env
        required: true
    volumes:
      - executor-data:/data
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:4788/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  executor-data:
